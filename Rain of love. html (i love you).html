<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>I LOVE YOU JAHIR 3D</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Importamos Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Escena, cámara y renderizador
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Control de cámara (rotación y zoom con mouse)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.enablePan = false;

    // Luz suave para dar profundidad
    const light = new THREE.PointLight(0xff00aa, 1.5, 150);
    light.position.set(10, 10, 10);
    scene.add(light);

    // Arrays para textos y corazones
    const textos = [];
    const corazones = [];

    // Cargar fuente cursiva y crear textos flotantes
    const loader = new THREE.FontLoader();
    loader.load('https://threejs.org/examples/fonts/optimer_regular.typeface.json', function(font) {
      const material = new THREE.MeshPhongMaterial({
        color: 0xff00aa,
        emissive: 0xff00aa,
        shininess: 100
      });
      for (let i = 0; i < 80; i++) {
        const geometry = new THREE.TextGeometry('I LOVE YOU JAHIR', {
          font: font,
          size: 1,
          height: 0.05,
          curveSegments: 12,
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.rotation.z = -0.25; // inclinación más marcada para simular cursiva
        mesh.position.set(
          (Math.random() - 0.5) * 50,
          Math.random() * 50,
          (Math.random() - 0.5) * 50
        );
        mesh.userData.velocidad = 0.05 + Math.random() * 0.1;
        textos.push(mesh);
        scene.add(mesh);
      }
    });

    // Crear corazones abundantes con efecto neón
    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, 0);
    heartShape.bezierCurveTo(0, 0, -1, -1, -2, 0);
    heartShape.bezierCurveTo(-3, 1, -3, 3, 0, 5);
    heartShape.bezierCurveTo(3, 3, 3, 1, 2, 0);
    heartShape.bezierCurveTo(1, -1, 0, 0, 0, 0);

    const heartGeometry = new THREE.ShapeGeometry(heartShape);
    const heartMaterial = new THREE.MeshPhongMaterial({
      color: 0xff00aa,
      emissive: 0xff00aa,
      shininess: 100
    });

    for (let i = 0; i < 300; i++) { // muchos corazones
      const heart = new THREE.Mesh(heartGeometry, heartMaterial);
      heart.scale.set(0.15, 0.15, 0.15);
      heart.position.set(
        (Math.random() - 0.5) * 50,
        Math.random() * 50,
        (Math.random() - 0.5) * 50
      );
      heart.userData.velocidad = 0.05 + Math.random() * 0.15;
      corazones.push(heart);
      scene.add(heart);
    }

    camera.position.z = 30;

    // Animación infinita
    function animate() {
      requestAnimationFrame(animate);

      // Actualizar textos
      textos.forEach(mesh => {
        mesh.position.y -= mesh.userData.velocidad;
        if (mesh.position.y < -30) {
          mesh.position.y = 50;
          mesh.position.x = (Math.random() - 0.5) * 50;
          mesh.position.z = (Math.random() - 0.5) * 50;
        }
      });

      // Actualizar corazones
      corazones.forEach(heart => {
        heart.position.y -= heart.userData.velocidad;
        if (heart.position.y < -30) {
          heart.position.y = 50;
          heart.position.x = (Math.random() - 0.5) * 50;
          heart.position.z = (Math.random() - 0.5) * 50;
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Ajuste al cambiar tamaño de ventana
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
